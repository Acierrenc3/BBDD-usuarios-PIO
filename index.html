<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base de Datos de Usuarios</title>
  <!-- Bootstrap CSS -->
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="text-center py-4">
    <h1 class="text-primary">Gestión de Usuarios</h1>
  </header>

  <main>
    <div class="container">
      <!-- Formulario -->
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-lg p-4">
            <h2 class="text-center text-primary mb-4">Formulario de Usuario</h2>
            <form id="user-form">
              <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" class="form-control" id="nombre" required />
              </div>
              <div class="form-group">
                <label for="dni">DNI</label>
                <input type="text" class="form-control" id="dni" required />
              </div>
              <div class="form-group">
                <label for="orientador">Orientador/a</label>
                <input type="text" class="form-control" id="orientador" />
              </div>
              <div class="form-group">
                <label for="fechaInicio">Fecha de Inicio IPE</label>
                <input type="date" class="form-control" id="fechaInicio" required />
              </div>
              <div class="form-group">
                <label for="fechaFin">Fecha de Fin IPE</label>
                <input type="date" class="form-control" id="fechaFin" required />
              </div>
              <div class="form-group">
                <label for="resultadoIpe">Resultado IPE</label>
                <select class="form-control" id="resultadoIpe" required>
                  <option value="">Seleccionar Resultado</option>
                  <option value="Positivo">Positivo</option>
                  <option value="Negativo">Negativo</option>
                  <option value="NP">NP</option>
                </select>
              </div>
              <button type="submit" class="btn btn-primary btn-block">Guardar</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Buscador -->
      <div class="row justify-content-center mt-5">
        <div class="col-12 col-md-8 col-lg-6">
          <h2 class="text-center text-primary mb-4">Buscar usuarios</h2>
          <input type="text" id="buscador" class="form-control" placeholder="Buscar por nombre, DNI o email" />
        </div>
      </div>

      <!-- Lista de usuarios -->
      <div class="row mt-5" id="user-list"></div>
    </div>
  </main>

  <!-- Firebase SDK + App -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBnq2-JxaYw697zpBRQiXqhNiwA9KGX_lw",
      authDomain: "bbdd-usuarios.firebaseapp.com",
      projectId: "bbdd-usuarios",
      storageBucket: "bbdd-usuarios.firebasestorage.app",
      messagingSenderId: "945433915987",
      appId: "1:945433915987:web:e0fdd14678de48239e4ca6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const userForm = document.getElementById('user-form');
    const userList = document.getElementById('user-list');
    const buscador = document.getElementById('buscador');

    let usuarios = [];

    userForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nuevoUsuario = {
        nombre: document.getElementById('nombre').value,
        dni: document.getElementById('dni').value,
        orientador: document.getElementById('orientador').value,
        fechaInicio: document.getElementById('fechaInicio').value,
        fechaFin: document.getElementById('fechaFin').value,
        resultadoIpe: document.getElementById('resultadoIpe').value
      };

      try {
        await addDoc(collection(db, "usuarios"), nuevoUsuario);
        alert("Usuario guardado exitosamente.");
        userForm.reset();
        loadUsers();
      } catch (error) {
        console.error("Error al guardar: ", error);
      }
    });

    async function loadUsers() {
      const querySnapshot = await getDocs(collection(db, "usuarios"));
      usuarios = [];
      querySnapshot.forEach((doc) => {
        usuarios.push({ ...doc.data(), id: doc.id });
      });
      mostrarUsuarios(usuarios);
    }

    function mostrarUsuarios(lista) {
      userList.innerHTML = '';
      lista.forEach((user) => {
        const col = document.createElement('div');
        col.className = 'col-md-4 mb-4';

        col.innerHTML = `
          <div class="card p-3 h-100">
            <h5>${user.nombre}</h5>
            <p><strong>DNI:</strong> ${user.dni}</p>
            <p><strong>Orientador/a:</strong> ${user.orientador}</p>
            <p><strong>Inicio IPE:</strong> ${user.fechaInicio}</p>
            <p><strong>Fin IPE:</strong> ${user.fechaFin}</p>
            <p><strong>Resultado:</strong> ${user.resultadoIpe}</p>
            <button class="btn btn-warning btn-sm btn-block editar">Editar</button>
            <button class="btn btn-danger btn-sm btn-block eliminar mt-2">Eliminar</button>
          </div>
        `;

        // Botón eliminar
        col.querySelector('.eliminar').addEventListener('click', async () => {
          await deleteDoc(doc(db, "usuarios", user.id));
          loadUsers();
        });

        // Botón editar
        col.querySelector('.editar').addEventListener('click', () => {
          document.getElementById('nombre').value = user.nombre;
          document.getElementById('dni').value = user.dni;
          document.getElementById('orientador').value = user.orientador;
          document.getElementById('fechaInicio').value = user.fechaInicio;
          document.getElementById('fechaFin').value = user.fechaFin;
          document.getElementById('resultadoIpe').value = user.resultadoIpe;

          // Eliminar y volver a crear con mismo ID (puedes mejorar con updateDoc si deseas mantenerlo exacto)
          userForm.onsubmit = async function (e) {
            e.preventDefault();
            const nuevosDatos = {
              nombre: document.getElementById('nombre').value,
              dni: document.getElementById('dni').value,
              orientador: document.getElementById('orientador').value,
              fechaInicio: document.getElementById('fechaInicio').value,
              fechaFin: document.getElementById('fechaFin').value,
              resultadoIpe: document.getElementById('resultadoIpe').value
            };
            await updateDoc(doc(db, "usuarios", user.id), nuevosDatos);
            alert("Usuario actualizado");
            userForm.reset();
            userForm.onsubmit = defaultFormSubmit;
            loadUsers();
          };
        });

        userList.appendChild(col);
      });
    }

    const defaultFormSubmit = userForm.onsubmit;

    buscador.addEventListener('input', () => {
      const filtro = buscador.value.toLowerCase();
      const filtrados = usuarios.filter(user =>
        user.nombre.toLowerCase().includes(filtro) ||
        user.dni.toLowerCase().includes(filtro)
      );
      mostrarUsuarios(filtrados);
    });

    window.onload = loadUsers;
  </script>
</body>
</html>
